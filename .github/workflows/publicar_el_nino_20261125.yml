name: Publicar arte El Nino 2026-2027
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar_el_nino_20261125.yml']
permissions:
  contents: read
concurrency:
  group: el-nino-20261125
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir data autorizada
        run: test "$(TZ=America/Sao_Paulo date +%F)" = "2026-11-25"
      - name: Conferir duplicacao, publicar e verificar media_id
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: previsaovr
          IMAGE_URL: https://github.com/pabloramoa-dev/previsao-rj/releases/download/el-nino-20261125/EL_NINO.jpg
        run: |
          pip install requests
          python - <<'PY'
          import os, json, time, unicodedata
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          assert datetime.now(ZoneInfo("America/Sao_Paulo")).date().isoformat()=="2026-11-25", "Publicacao autorizada apenas em 25/11/2026"
          uid=os.environ["IG_USER_ID"]; token=os.environ["IG_ACCESS_TOKEN"]
          expected=os.environ["EXPECTED_IG_USERNAME"]
          assert uid and token, "Credenciais Meta ausentes"
          base="https://"+("graph.facebook.com" if token.startswith("EAA") else "graph.instagram.com")+"/"+os.environ.get("META_GRAPH_VERSION","v26.0")
          headers={"Authorization":"Bearer "+token}
          def call(method,path,data):
              try:
                  r=requests.request(method,base+"/"+path,headers=headers,timeout=90,**({"params":data} if method=="GET" else {"data":data}))
              except requests.RequestException:
                  raise RuntimeError("Falha de transporte Meta; nenhuma repeticao automatica de POST") from None
              try: j=r.json()
              except ValueError: raise RuntimeError("Resposta Meta nao JSON") from None
              if not r.ok or "error" in j:
                  e=j.get("error",{})
                  raise RuntimeError("Meta HTTP %s code %s subcode %s: %s"%(r.status_code,e.get("code"),e.get("error_subcode"),str(e.get("message","")).replace(token,"[redacted]")))
              return j
          account=call("GET",uid,{"fields":"id,username"})
          assert account.get("username","").lower()==expected, "Conta Meta difere do perfil esperado: "+account.get("username","")
          caption="🌎 EL NIÑO 2026/2027 | Atualização: 25/11/2026\n\nO boletim NOAA/CPC de 12/11 indica El Niño em fortalecimento, com cenário forte a muito forte provável até jan–mar/2027. O pico é esperado entre nov/2026 e jan/2027, seguido de enfraquecimento.\n\nProbabilidades NOAA/CPC de novembro:\n• Dez–jan–fev: 100% de El Niño.\n• Fev–mar–abr: 98%.\n• Mar–abr–mai: 80%.\n• Abr–mai–jun: 61% de neutralidade.\nSão probabilidades do fenômeno no Pacífico, não de chuva na sua cidade.\n\nO Painel El Niño nº 5 (INMET/INPE e parceiros) aponta para nov/2026–jan/2027 mais chuva no Sul e em partes do Sudeste e Centro-Oeste; menos chuva em grande parte do Norte e áreas do Nordeste e Centro-Oeste. Os impactos variam regionalmente.\n\nVolta Redonda: acompanhe a previsão da cidade e os avisos oficiais para planejar sua rotina. A tendência climática não indica o horário nem o bairro de uma eventual chuva forte.\n\n📚 Fontes oficiais:\nNOAA/CPC: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/probabilities/\nINMET — Painel El Niño nº 5: https://portal.inmet.gov.br/noticias/painel-el-ni%C3%B1o-boletim-de-outubro-%C3%A9-divulgado\n\nImagem ilustrativa gerada por IA. Tendência climática não substitui previsão diária nem alerta da Defesa Civil.\n\n📲 Compartilhe com quem precisa acompanhar o clima da região e siga @previsaovr.\n\n#ElNino #Clima #VoltaRedonda #VR #Retiro #SulFluminense #ElNino25112026"
          def normalized(s):
              return "".join(c for c in unicodedata.normalize("NFD",s.lower()) if unicodedata.category(c)!="Mn")
          def existing():
              after=None
              for page in range(10):
                  args={"fields":"id,caption,permalink,timestamp,media_type","limit":100}
                  if after: args["after"]=after
                  response=call("GET",uid+"/media",args)
                  items=response.get("data",[])
                  for item in items:
                      c=normalized(item.get("caption") or "")
                      if "#elnino25112026" in c or ("el nino" in c and "2026" in c and "2027" in c):
                          return item
                  if not response.get("paging",{}).get("next") or not items: return None
                  if min(i.get("timestamp","9999") for i in items)<"2026-11-20": return None
                  after=response["paging"].get("cursors",{}).get("after")
                  assert after, "Paginacao sem cursor; verificacao inconclusiva"
              raise RuntimeError("Historico excede limite; publicacao bloqueada para evitar duplicacao")
          found=existing()
          Path("saida").mkdir(exist_ok=True)
          if found:
              result={"status":"existing","profile":expected,"media_id":found["id"],"permalink":found.get("permalink")}
          else:
              cid=call("POST",uid+"/media",{
                  "image_url":os.environ["IMAGE_URL"],"caption":caption,"is_ai_generated":"true",
                  "alt_text":"Infografico ilustrativo gerado por IA sobre El Nino 2026/2027. Probabilidades e contexto regional descritos na legenda."
              })["id"]
              Path("saida/container.json").write_text(json.dumps({"container_id":cid,"profile":expected}))
              for attempt in range(36):
                  status=call("GET",cid,{"fields":"status_code"}).get("status_code")
                  if status=="FINISHED":break
                  if status in ("ERROR","EXPIRED"):raise RuntimeError("Container "+status)
                  time.sleep(5)
              else:raise RuntimeError("Container nao concluido")
              # One publish request only; ambiguous transport failures must be reconciled before retry.
              mid=call("POST",uid+"/media_publish",{"creation_id":cid})["id"]
              result={"status":"published","profile":expected,"media_id":mid,"container_id":cid,"ai_disclosure_sent":True}
              Path("saida/recibo.json").write_text(json.dumps(result))
          verified=call("GET",result["media_id"],{"fields":"id,permalink,media_type,caption,timestamp,username"})
          assert verified["id"]==result["media_id"]
          assert verified.get("username","").lower()==expected
          assert verified.get("media_type")=="IMAGE", "Post encontrado nao e imagem; revisar manualmente"
          result.update(verified=True,permalink=verified.get("permalink"),timestamp=verified.get("timestamp"))
          Path("saida/recibo.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print("RECIBO_META "+json.dumps(result,ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Publicacao El Nino verificada\n\nPerfil: @"+expected+"\n\nmedia_id: "+result["media_id"]+"\n\n"+str(result.get("permalink"))+"\n\nStatus: "+result["status"]+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recibo-el-nino-previsaovr
          path: saida/*.json
          if-no-files-found: warn
          retention-days: 14
